[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-holmes"
version = "0.1.0"
description = "A read-only Kubernetes investigation console powered by HolmesGPT"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Aegis Holmes contributors"}]
dependencies = ["rich>=13.7,<15"]
keywords = ["kubernetes", "holmesgpt", "aiops", "troubleshooting"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
holmes-console = "holmes_console.cli:main"
aegis-holmes = "holmes_console.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

