{{- if .Values.healer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-healer
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}-healer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Release.Name }}-healer}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: healer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["alert-healer"]
          args:
            - --host
            - 0.0.0.0
            - --mode
            - {{ .Values.healer.mode | quote }}
            - --max-risk-score
            - {{ .Values.healer.maxRiskScore | quote }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: HOME
              value: /home/console
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecret.name }}
                  key: {{ .Values.providerSecret.key }}
            - name: HOLMES_HEALER_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecret.name }}
                  key: {{ .Values.healer.webhookTokenSecretKey }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - {name: holmes-home, mountPath: /home/console/.holmes}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: holmes-home
          emptyDir: {}
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-healer
spec:
  selector: {app.kubernetes.io/name: {{ .Release.Name }}-healer}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- end }}
