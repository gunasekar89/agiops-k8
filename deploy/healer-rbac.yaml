# Write permission is intentionally namespace-scoped and limited to deleting pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: holmes-healer-recycle-pods
  namespace: holmes-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: holmes-healer-recycle-pods
  namespace: holmes-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: holmes-healer-recycle-pods
subjects:
  - kind: ServiceAccount
    name: holmes-console
    namespace: holmes-system

