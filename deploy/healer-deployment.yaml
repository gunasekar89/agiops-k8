apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-healer
  namespace: holmes-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: alert-healer}
  template:
    metadata:
      labels: {app: alert-healer}
    spec:
      serviceAccountName: holmes-console
      containers:
        - name: healer
          image: ghcr.io/gunasekar89/agiops-k8:latest
          command: ["alert-healer"]
          args: ["--host", "0.0.0.0", "--mode", "observe", "--max-risk-score", "25"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /home/console
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: holmes-provider-credentials
                  key: OPENAI_API_KEY
            - name: HOLMES_HEALER_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: holmes-provider-credentials
                  key: WEBHOOK_TOKEN
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - {name: holmes-home, mountPath: /home/console/.holmes}
            - {name: temporary, mountPath: /tmp}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: holmes-home
          emptyDir: {}
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-healer
  namespace: holmes-system
spec:
  selector: {app: alert-healer}
  ports:
    - name: http
      port: 8080
      targetPort: http
