apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-healer-ingress
  namespace: holmes-system
spec:
  podSelector:
    matchLabels: {app: alert-healer}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - {protocol: TCP, port: 8080}
